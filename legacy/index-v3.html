<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Demo de Mostrador: gestión simple para comercios argentinos. Ventas, stock, proveedores, caja, fiado y facturación ARCA simulada.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%231c5d84%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-family=%22Arial%22 font-weight=%22bold%22 font-size=%2220%22 fill=%22white%22 text-anchor=%22middle%22%3EM%3C/text%3E%3C/svg%3E">
<title>Mostrador Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: herramienta de mostrador — 8 secciones en dos grupos (día a día / administración); en celular, barra inferior con lo diario */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f4f6f8; --line:#d6dce3; --line-2:#e6eaef;
  --fg:#15202b; --muted:#56636f; --accent:#1c5d84; --accent-ink:#ffffff; --accent-soft:#e0ecf4;
  --ok:#1e7a4c; --ok-soft:#e1f2e8; --warn:#9a5806; --warn-soft:#fbefd8; --bad:#b3261e; --bad-soft:#fbe3e0;
  --side:#13222f; --side-fg:#c9d6e1; --side-hi:#1f3446;
  --f-display:'Archivo','Arial Narrow',Arial,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(16,32,48,.06),0 10px 28px rgba(16,32,48,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151d25; --surface-2:#1b252f; --line:#2a3642; --line-2:#222d38;
  --fg:#e5ebf0; --muted:#98a6b3; --accent:#6db2da; --accent-ink:#0a1722; --accent-soft:#163049;
  --ok:#5cc28c; --ok-soft:#12301f; --warn:#e3a64b; --warn-soft:#382910; --bad:#f07b6f; --bad-soft:#3b1a17;
  --side:#0a1016; --side-fg:#a3b3c1; --side-hi:#16222d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151d25; --surface-2:#1b252f; --line:#2a3642; --line-2:#222d38;
  --fg:#e5ebf0; --muted:#98a6b3; --accent:#6db2da; --accent-ink:#0a1722; --accent-soft:#163049;
  --ok:#5cc28c; --ok-soft:#12301f; --warn:#e3a64b; --warn-soft:#382910; --bad:#f07b6f; --bad-soft:#3b1a17;
  --side:#0a1016; --side-fg:#a3b3c1; --side-hi:#16222d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
html.big body{zoom:1.14}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:16px;padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:36px;height:36px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:18px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:17px;color:#fff;line-height:1.15}
.brand-sub{font-size:12px;color:var(--side-fg)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-fg);opacity:.7;padding:12px 12px 4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;font-weight:600;color:var(--side-fg)}
.nav button:hover{background:var(--side-hi);color:#fff}
.nav button[aria-current="page"]{background:var(--side-hi);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .count{margin-left:auto;font-size:11px;font-weight:700;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px}
.side-foot{margin-top:auto;font-size:12px;padding:0 8px;line-height:1.5}
.side-foot strong{color:#fff;font-weight:600;display:block}
.topbar{display:none}
.bnav{display:none}

.main{min-width:0;display:flex;flex-direction:column}
.demo-strip{background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:600;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.page{padding-block:24px 56px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1240px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{font-size:28px;font-weight:700}
.head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 0;flex-wrap:wrap}
.card-h h2{font-size:17px;font-weight:700}
.card-b{padding:14px 18px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.g-main{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:1050px){.g-main{grid-template-columns:minmax(0,1fr)}}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.tile{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px;min-height:118px}
.tile:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.tile:focus-visible{outline:2px solid var(--accent)}
.tile .ti{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile .ti svg.i{width:23px;height:23px}
.tile b{font-family:var(--f-display);font-size:19px;font-weight:700}
.tile span{color:var(--muted);font-size:13.5px}
.tile.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.main .ti{background:rgba(255,255,255,.18);color:var(--accent-ink)}
.tile.main span{color:var(--accent-ink);opacity:.85}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:13.5px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.alert .v{color:var(--bad)}
.kpi.good .v{color:var(--ok)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;min-height:40px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;min-height:32px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.big{padding:15px 20px;font-size:18px;font-family:var(--f-display);font-weight:700;min-height:56px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.link:hover{text-decoration:underline}
.link:focus-visible{outline:2px solid var(--accent)}
.help{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:14px;padding:6px 10px;border-radius:8px;background:var(--accent-soft)}
.help:focus-visible{outline:2px solid var(--accent)}

input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0;min-height:40px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
textarea{width:100%;font-family:var(--f-mono);font-size:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lb{font-size:13.5px;font-weight:600}
.field input,.field select{width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.form .full{grid-column:1/-1}
.hint{font-size:12.5px;color:var(--muted)}
details.more{border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
details.more summary{cursor:pointer;padding:10px 12px;font-weight:600;color:var(--accent)}
details.more>div{padding:4px 12px 14px}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:left;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
td .sub{display:block;font-size:12.5px;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.cb{font-family:var(--f-mono);font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}

.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.li:last-child{border-bottom:0}
.li .t{min-width:0}
.li .t b{font-weight:600;display:block}
.alerts{display:flex;flex-direction:column;gap:8px}
.alertrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;background:var(--surface-2);flex-wrap:wrap}
.alertrow .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.alertrow .dot.bad{background:var(--bad)}.alertrow .dot.warn{background:var(--warn)}.alertrow .dot.ok{background:var(--ok)}
.alertrow p{margin:0;flex:1;min-width:180px}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:99px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:11px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:11px 8px;font-weight:700;cursor:pointer;text-align:center;min-height:48px}
.choice:hover{border-color:var(--accent)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

.note{border:1px dashed var(--line);border-radius:var(--r);padding:13px 15px;background:var(--surface-2);font-size:14px;color:var(--muted)}
.note strong{color:var(--fg)}
.okbox{border-radius:var(--r);padding:13px 15px;background:var(--ok-soft);color:var(--ok);font-weight:600;display:flex;align-items:center;gap:10px}

.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;min-width:230px;z-index:30}
.menu button{all:unset;cursor:pointer;padding:10px 12px;border-radius:7px;font-weight:600;display:flex;gap:10px;align-items:center}
.menu button:hover,.menu button:focus-visible{background:var(--surface-2)}

/* Vender */
.pos{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,410px);gap:18px;align-items:start}
@media (max-width:980px){.pos{grid-template-columns:minmax(0,1fr)}}
.scan{display:flex;gap:8px}
.scan input{flex:1;font-size:17px;padding:13px 14px;min-height:52px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.pbtn{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;min-height:86px}
.pbtn:hover{border-color:var(--accent)}
.pbtn:focus-visible{outline:2px solid var(--accent)}
.pbtn .pn{font-weight:600;font-size:14px;line-height:1.25}
.pbtn .pp{font-family:var(--f-display);font-weight:700;font-size:17px;margin-top:auto;font-variant-numeric:tabular-nums}
.pbtn .ps{font-size:12px;color:var(--muted)}
.pbtn .ps.bad{color:var(--bad);font-weight:600}
.pbtn.out{opacity:.5}
.cart{position:sticky;top:12px;display:flex;flex-direction:column}
.cart-lines{max-height:320px;overflow:auto;border-block:1px solid var(--line-2)}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line-2)}
.cl:last-child{border-bottom:0}
.cl .nm{font-weight:600;font-size:14px}
.cl .pu{font-size:12.5px;color:var(--muted)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;background:var(--surface-2)}
.qty button:hover{color:var(--accent)}
.qty button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.qty input{width:54px;border:0;border-radius:0;text-align:center;padding:4px;min-height:34px;font-weight:700}
.tot{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums;padding:2px 0}
.tot.big{font-family:var(--f-display);font-size:30px;font-weight:800;padding-top:4px}
.tot.small{font-size:13px;color:var(--muted)}
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:14px}
.vuelto{font-family:var(--f-display);font-size:22px;font-weight:800}

/* Llegó mercadería */
.provcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.pc{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.pc:hover{border-color:var(--accent)}
.pc:focus-visible{outline:2px solid var(--accent)}
.pc b{font-size:15.5px}
.recv input{width:96px;text-align:right}

/* Proveedores / clientes */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.pcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pcard h3{font-size:17px}
.pcard .meta{font-size:13.5px;color:var(--muted)}
.pcard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}

/* Chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid-l{stroke:var(--line-2)}
.chart .b{fill:var(--accent)}
.chart .b.today{fill:var(--ok)}

/* Primeros pasos */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:8px;background:var(--surface-2)}
.step .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:700;color:var(--muted)}
.step.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.step.done b{text-decoration:line-through;color:var(--muted)}
.howto{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.howto li{padding-left:4px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,18,26,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow:auto;z-index:50}
.modal-card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(600px,100%);display:flex;flex-direction:column;border:1px solid var(--line)}
.modal-card.wide{width:min(900px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h2{font-size:20px}
.mb{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.mf .sp{margin-right:auto}
.x{all:unset;cursor:pointer;font-size:24px;line-height:1;color:var(--muted);padding:4px 8px;border-radius:6px}
.x:hover{background:var(--surface-2)}
.x:focus-visible{outline:2px solid var(--accent)}
.done-hero{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding:6px 0}
.done-hero .ok{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.done-hero .ok svg.i{width:30px;height:30px;stroke-width:2.6}

function buildVenta({items,clienteId,tipo,medio,desc,fecha,cfg}){
  const f=1-(num(desc)/100);let total=0,n21=0,n105=0,nEx=0,i21=0,i105=0,costo=0;
  items.forEach(it=>{const sub=it.precio*it.cant*f;total+=sub;costo+=it.costo*it.cant;
    if(it.iva===21){const n=sub/1.21;n21+=n;i21+=sub-n}else if(it.iva===10.5){const n=sub/1.105;n105+=n;i105+=sub-n}else nEx+=sub});
  const neto=(cfg.condIva==='RI')?total-(i21+i105):total;
  return {id:uid(),fecha:fecha||new Date().toISOString(),items:items.map(i=>({...i})),clienteId,tipo,medio,desc:num(desc),
    total:r2(total),n21:r2(n21),n105:r2(n105),nEx:r2(nEx),i21:r2(i21),i105:r2(i105),neto:r2(neto),costo:r2(costo),condEmisor:cfg.condIva};
}
function buildCompra({provId,tipo,nroComp,cond,medio,items,fecha}){
  let neto=0,iva=0;items.forEach(i=>{const n=i.costo*i.cant;neto+=n;if(tipo==='Factura A')iva+=n*i.iva/100});
  return {id:uid(),fecha:fecha||new Date().toISOString(),provId,tipo,nroComp,cond,medio:cond==='contado'?medio:'',items:items.map(i=>({...i})),neto:r2(neto),iva:r2(iva),total:r2(neto+iva)};
}

function chart14(){
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(dkey(d))}
  const vals=days.map(k=>sum(S.ventas.filter(v=>dkey(v.fecha)===k),'total'));
  const max=Math.max(...vals,1);const step=Math.pow(10,Math.floor(Math.log10(max)));const top=Math.ceil(max/step/2)*step*2||1;
  const W=600,H=220,L=58,B=26,T=10,cw=(W-L-8)/14,bw=cw*0.62;
  let g='';for(let i=0;i<=4;i++){const v=top*i/4,y=T+(H-T-B)*(1-i/4);g+=`<line class="grid-l" x1="${L}" x2="${W-4}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">$${NFc.format(v)}</text>`}
  const bars=vals.map((v,i)=>{const h=(H-T-B)*v/top,x=L+i*cw+(cw-bw)/2,y=H-B-h;const d=new Date(days[i]+'T12:00');
    return `<rect class="b ${i===13?'today':''}" x="${x}" y="${y}" width="${bw}" height="${Math.max(h,0)}" rx="3"><title>${fD(d)}: ${f$(v)}</title></rect><text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${d.getDate()}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas diarias de las últimas dos semanas">${g}${bars}</svg>`;
}

function cobrar(){
  if(!pos.items.length)return;
  const c=cli(pos.clienteId);
  if(pos.medio==='Cuenta corriente'&&pos.clienteId==='c0'){pos.opts=true;renderCart();toast('Para fiar, elegí a qué cliente');return}
  if(pos.tipo==='FA'&&(!c||c.condIva!=='RI'||!c.cuit)){toast('La Factura A necesita un cliente Responsable Inscripto con CUIT');return}
  for(const i of pos.items){const p=prod(i.pid);if(i.cant<=0){toast('Revisá las cantidades');return}if(p&&i.cant>p.stock){toast('No alcanza el stock de '+p.nombre);return}}
  const v=buildVenta({items:pos.items,clienteId:pos.clienteId,tipo:pos.tipo,medio:pos.medio,desc:pos.desc,cfg:S.config});
  v.nro=nextNro(S,v.tipo);assignCAE(v);
  v.items.forEach(i=>{const p=prod(i.pid);if(p)p.stock=r2(p.stock-i.cant)});
  S.ventas.push(v);S.guia.venta=true;save();
  const vuelto=pos.medio==='Efectivo'&&pos.paga>0?pos.paga-v.total:null;
  pos={items:[],clienteId:'c0',tipo:null,medio:'Efectivo',desc:0,paga:0,cat:pos.cat,q:'',opts:false};
  render();
  if(v.tipo==='TK')ventaLista(v,vuelto);
  else{openModal(mHead('Haciendo la factura…')+`<div class="mb" style="text-align:center"><div class="spin" role="status" aria-label="Procesando"></div><p class="muted">Pidiendo la autorización a ARCA (simulado).</p></div>`);setTimeout(()=>ventaLista(v,vuelto),900)}
}

function fakeQR(seedStr){
  let h=0;for(const ch of seedStr)h=(h*31+ch.charCodeAt(0))|0;const R=rng(h);const N=25;let r='';
  const finder=(x,y)=>{let s='';for(let i=0;i<7;i++)for(let j=0;j<7;j++){const e=i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4);if(e)s+=`<rect x="${x+j}" y="${y+i}" width="1" height="1"/>`}return s};
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const inF=(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);if(!inF&&R()<.48)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
  return `<svg viewBox="-1 -1 ${N+2} ${N+2}" aria-label="Código QR simulado">${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}${r}</svg>`;
}

function importForm(){menuOpen=false;importRows=null;openModal(mHead('Cargar productos desde Excel','Si el código ya existe, se actualiza. Si no, se crea.')+`<div class="mb">
  <ol class="howto"><li>Descargá la planilla de ejemplo y completala. <button class="link" data-act="plantilla">Descargar planilla</button></li><li>Elegí el archivo, o copiá las filas en Excel y pegalas abajo.</li><li>Revisá la vista previa y tocá "Cargar".</li></ol>

  <div class="field"><label for="imp-txt">O pegá acá las filas (con el encabezado)</label><textarea id="imp-txt" rows="4" data-imp="txt" placeholder="codigo	nombre	categoria	proveedor	costo	margen	iva	stock	stock_min"></textarea></div>
  <div id="imp-prev"></div></div>
  <div class="mf"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="doimport" id="imp-go" disabled>Cargar</button></div>`,true)}
function parseImport(rows){
  const norm=k=>String(k).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z_]/g,'');
  const out=rows.map(r=>{const o={};for(const k in r)o[norm(k)]=r[k];return o}).filter(o=>o.codigo&&o.nombre).map(o=>{
    const pv=S.proveedores.find(p=>p.nombre.toLowerCase()===String(o.proveedor||'').toLowerCase());
    return {codigo:String(o.codigo).trim(),nombre:String(o.nombre).trim(),categoria:String(o.categoria||'Varios').trim(),provId:pv?pv.id:'',costo:num(o.costo),margen:o.margen===''||o.margen==null?40:num(o.margen),iva:o.iva===''||o.iva==null?21:num(o.iva),stock:num(o.stock),stockMin:num(o.stock_min||o.stockmin||5),unidad:'u'}});
  importRows=out;const nuevos=out.filter(r=>!S.productos.some(p=>p.codigo===r.codigo)).length;
  $('#imp-prev').innerHTML=out.length?`<div class="okbox">${ic('check')}${out.length} productos listos: ${nuevos} nuevos y ${out.length-nuevos} para actualizar</div><div class="tw"><table><thead><tr><th>Producto</th><th class="n">Lo comprás a</th><th class="n">Se vende a</th></tr></thead><tbody>${out.slice(0,6).map(r=>`<tr><td>${esc(r.nombre)}</td><td class="n">${f$(r.costo)}</td><td class="n">${f$(calcPrecio(r))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="note">No encontramos filas con código y nombre. Fijate que la primera fila tenga los títulos de la planilla de ejemplo.</div>';
  $('#imp-go').disabled=!out.length;
}
function readImport(src,isText){
  if(typeof XLSX==='undefined'){toast('No se pudo abrir el lector de planillas');return}
  try{const wb=isText?XLSX.read(src,{type:'string'}):XLSX.read(src,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];parseImport(XLSX.utils.sheet_to_json(ws,{defval:''}))}
  catch(e){$('#imp-prev').innerHTML='<div class="note">No pudimos leer el archivo. Probá guardarlo como .xlsx.</div>'}
}
function doImport(){if(!importRows)return;let n=0,u=0;importRows.forEach(r=>{const ex=S.productos.find(p=>p.codigo===r.codigo);const precio=calcPrecio(r);
  if(ex){Object.assign(ex,{nombre:r.nombre,categoria:r.categoria,costo:r.costo,margen:r.margen,iva:r.iva,precio,stockMin:r.stockMin});if(r.provId)ex.provId=r.provId;u++}
  else{S.productos.push({id:'x'+uid(),...r,provId:r.provId||(S.proveedores[0]||{}).id||'',precio});n++}});
  save();closeModal();render();toast(`Listo: ${n} productos nuevos y ${u} actualizados`)}

let iTab='historial',rMes=null,hp={tipo:'mes',ref:null};
const DIAS=['lun','mar','mié','jue','vie','sáb','dom'];
const MESC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const PER={dia:'Día',semana:'Semana',mes:'Mes',anio:'Año'};
function rango(tipo,ref){
  const r=new Date(ref+'T00:00');let from,to,label;const sub=[];
  if(tipo==='dia'){
    from=new Date(r);to=new Date(r);to.setDate(to.getDate()+1);
    const ay=new Date();ay.setDate(ay.getDate()-1);
    label=ref===today()?'Hoy':ref===dkey(ay)?'Ayer':r.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    for(let h=8;h<=22;h++){const f=new Date(r),t=new Date(r);f.setHours(h===8?0:h);t.setHours(h===22?24:h+1);sub.push({l:h+'h',f,t})}
  }else if(tipo==='semana'){
    from=new Date(r);from.setDate(from.getDate()-((r.getDay()+6)%7));to=new Date(from);to.setDate(to.getDate()+7);
    const fin=new Date(to);fin.setDate(fin.getDate()-1);
    label=from.getMonth()===fin.getMonth()?`Semana del ${from.getDate()} al ${fin.getDate()} de ${MESES[fin.getMonth()]}`:`Semana del ${from.getDate()} de ${MESES[from.getMonth()]} al ${fin.getDate()} de ${MESES[fin.getMonth()]}`;
    for(let i=0;i<7;i++){const f=new Date(from);f.setDate(f.getDate()+i);const t=new Date(f);t.setDate(t.getDate()+1);sub.push({l:DIAS[i]+' '+f.getDate(),f,t,drill:['dia',dkey(f)]})}
  }else if(tipo==='mes'){
    from=new Date(r.getFullYear(),r.getMonth(),1);to=new Date(r.getFullYear(),r.getMonth()+1,1);
    label=MESES[from.getMonth()]+' '+from.getFullYear();label=label[0].toUpperCase()+label.slice(1);
    for(let f=new Date(from);f<to;f.setDate(f.getDate()+1)){const ff=new Date(f),t=new Date(f);t.setDate(t.getDate()+1);sub.push({l:String(ff.getDate()),f:ff,t,drill:['dia',dkey(ff)],nombre:DIAS[(ff.getDay()+6)%7]+' '+ff.getDate()})}
  }else{
    from=new Date(r.getFullYear(),0,1);to=new Date(r.getFullYear()+1,0,1);label='Año '+from.getFullYear();
    for(let m=0;m<12;m++){const f=new Date(from.getFullYear(),m,1),t=new Date(from.getFullYear(),m+1,1);sub.push({l:MESC[m],f,t,drill:['mes',dkey(f)],nombre:MESES[m]})}
  }
  return {from,to,label,sub};
}
function moverRef(tipo,ref,dir){const d=new Date(ref+'T12:00');if(tipo==='dia')d.setDate(d.getDate()+dir);else if(tipo==='semana')d.setDate(d.getDate()+7*dir);else if(tipo==='mes'){d.setDate(1);d.setMonth(d.getMonth()+dir)}else{d.setDate(1);d.setMonth(0);d.setFullYear(d.getFullYear()+dir)}return dkey(d)}
const enR=(f,R)=>{const t=new Date(f);return t>=R.from&&t<R.to};
function statsR(R){const vs=S.ventas.filter(v=>enR(v.fecha,R)),gs=S.gastos.filter(g=>enR(g.fecha,R));
  const total=sum(vs,'total'),neto=sum(vs,'neto'),costo=sum(vs,'costo'),gastos=sum(gs,'monto');
  return {vs,gs,total,neto,costo,gastos,n:vs.length,bruto:neto-costo,gan:neto-costo-gastos}}
function chartBars(labels,vals,hi,aria){
  const n=vals.length,max=Math.max(...vals,1);const step=Math.pow(10,Math.floor(Math.log10(max)));const top=Math.ceil(max/step/2)*step*2||1;
  const W=660,H=230,L=60,B=28,T=10,cw=(W-L-8)/n,bw=Math.max(cw*0.64,2);const every=n>16?Math.ceil(n/12):1;
  let g='';for(let i=0;i<=4;i++){const v=top*i/4,y=T+(H-T-B)*(1-i/4);g+=`<line class="grid-l" x1="${L}" x2="${W-4}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">$${NFc.format(v)}</text>`}
  const bars=vals.map((v,i)=>{const h=(H-T-B)*v/top,x=L+i*cw+(cw-bw)/2,y=H-B-h;
    return `<rect class="b ${i===hi?'today':''}" x="${x}" y="${y}" width="${bw}" height="${Math.max(h,0)}" rx="2"><title>${esc(labels[i])}: ${f$(v)}</title></rect>${i%every===0?`<text x="${x+bw/2}" y="${H-9}" text-anchor="middle">${esc(labels[i])}</text>`:''}`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${g}${bars}</svg>`;
}
function vInformes(){
  return head('Informes','Tu historial de ventas por día, semana, mes y año, y lo que necesita tu contador.','','informes')+
  tabs(iTab,[['historial','Historial','informes'],['contador','Para el contador','down']],'itab')+(iTab==='historial'?tHistorial():tContador());
}
function tHistorial(){
  hp.ref=hp.ref||today();
  const R=rango(hp.tipo,hp.ref),P=rango(hp.tipo,moverRef(hp.tipo,hp.ref,-1));
  const now=new Date();const hayMas=R.to<=now;const parcial=now>=R.from&&now<R.to;
  const st=statsR(R),sp=statsR(parcial?{from:P.from,to:new Date(P.from.getTime()+(now-R.from))}:P);
  const primera=S.ventas.reduce((m,v)=>v.fecha<m?v.fecha:m,'9');const completo=primera!=='9'&&new Date(primera)<=P.from;
  const pct=completo&&sp.total>0?(st.total-sp.total)/sp.total*100:null;
  const antes={dia:'el día anterior',semana:'la semana anterior',mes:'el mes anterior',anio:'el año anterior'}[hp.tipo];
  const porSub=R.sub.map(b=>{const vs=st.vs.filter(v=>enR(v.fecha,b));return {...b,vs,total:sum(vs,'total'),gan:sum(vs,v=>v.neto-v.costo)}});
  const hi=porSub.findIndex(b=>now>=b.f&&now<b.t);
  const top={};st.vs.forEach(v=>v.items.forEach(i=>{const t=top[i.pid]=top[i.pid]||{nombre:i.nombre,cant:0,total:0};t.cant+=i.cant;t.total+=i.precio*i.cant*(1-(v.desc||0)/100)}));
  const topL=Object.values(top).sort((a,b)=>b.total-a.total).slice(0,8);
  const porMed={};st.vs.forEach(v=>porMed[ML(v.medio)]=(porMed[ML(v.medio)]||0)+v.total);const mx=Math.max(1,...Object.values(porMed));

  }else{
    const filas=porSub.slice().filter(b=>b.f<=now);
    const nom=hp.tipo==='anio'?'Mes':'Día';
    detalle=`<div class="card"><div class="card-h"><h2>${hp.tipo==='anio'?'Mes por mes':'Día por día'}</h2><span class="hint">Tocá una fila para ver el detalle</span></div><div class="card-b"><div class="tw"><table><thead><tr><th>${nom}</th><th class="n">Ventas</th><th class="n">Vendiste</th><th class="n">Ganancia bruta</th><th></th></tr></thead><tbody>
      ${filas.slice().reverse().map(b=>`<tr><td><b>${esc(b.nombre||b.l)}</b></td><td class="n">${b.vs.length}</td><td class="n"><b>${f$(b.total)}</b></td><td class="n">${f$(b.gan)}</td><td style="text-align:right"><button class="btn sm" data-act="hpdrill" data-t="${b.drill[0]}" data-r="${b.drill[1]}">Ver ${b.drill[0]==='dia'?'día':'mes'}</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Sin datos.</td></tr>'}
    </tbody><tfoot><tr><td>Total</td><td class="n">${st.n}</td><td class="n">${f$(st.total)}</td><td class="n">${f$(st.bruto)}</td><td></td></tr></tfoot></table></div></div></div>`;
  }
  return `<div class="toolbar" style="justify-content:space-between">
    <div class="chips" role="group" aria-label="Período">${Object.entries(PER).map(([k,l])=>`<button class="chip" data-act="hptipo" data-t="${k}" aria-pressed="${hp.tipo===k}">${l}</button>`).join('')}</div>
    <div class="toolbar"><button class="btn sm" data-act="hpmov" data-d="-1" aria-label="Período anterior">‹ Anterior</button><b style="min-width:12ch;text-align:center">${esc(R.label)}</b><button class="btn sm" data-act="hpmov" data-d="1" ${hayMas?'':'disabled'} aria-label="Período siguiente">Siguiente ›</button>${hp.ref!==today()?'<button class="link" data-act="hphoy">Ir a hoy</button>':''}</div>
  </div>
  <div class="kpis">
    <div class="kpi"><span class="l">Vendiste</span><span class="v">${f$(st.total)}</span><span class="s">${pct==null?'No hay datos completos '+antes.replace(/^el /,'del ').replace(/^la /,'de la '):`<b style="color:${pct>=0?'var(--ok)':'var(--bad)'}">${pct>=0?'▲':'▼'} ${fn(Math.abs(Math.round(pct)))}%</b> contra ${antes}${parcial?' a esta altura':''}`}</span></div>
    <div class="kpi"><span class="l">Cantidad de ventas</span><span class="v">${st.n}</span><span class="s">Ticket promedio ${f$(st.n?st.total/st.n:0)}</span></div>

  ${detalle}
  <div class="grid g2">
   <div class="card"><div class="card-h"><h2>Las cuentas</h2></div><div class="card-b" style="display:flex;flex-direction:column;gap:8px">

    <p class="hint" style="margin:0">${hp.tipo==='dia'?'En un solo día los gastos grandes, como el alquiler, pueden dar pérdida aunque el mes cierre bien.':'Cuenta aproximada para que sepas cómo vas. No reemplaza el balance de tu contador.'}</p>
   </div></div>
   <div class="card"><div class="card-h"><h2>Lo que más se vendió</h2></div><div class="card-b"><div class="list">
    ${topL.map((t,i)=>`<div class="li"><div class="t"><b>${i+1}. ${esc(t.nombre)}</b><span class="hint">${fn(t.cant)} vendidos</span></div><span class="num">${f$(t.total)}</span></div>`).join('')||'<div class="empty">No hubo ventas.</div>'}
   </div></div></div>
  </div>

function autoCols(rows){if(!rows.length)return[];return Object.keys(rows[0]).map(k=>({wch:Math.min(48,Math.max(k.length,...rows.slice(0,200).map(r=>String(r[k]==null?'':r[k]).length))+2)}))}
async function exportXLSX(filename,sheets){
  if(typeof XLSX==='undefined'){toast('No se pudo preparar el Excel');return}
  const wb=XLSX.utils.book_new();
  for(const [name,rows] of Object.entries(sheets)){const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{'Sin datos':''}]);ws['!cols']=autoCols(rows);XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31))}
  if(downloads){try{const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});await downloads.save({filename,data:new Blob([buf])});toast('Excel descargado: '+filename)}
    catch(e){const code=e&&e.code;if(code==='declined')return;if(code==='rate_limited'){toast('Ya hay una descarga esperando tu confirmación');return}csvFallback(filename,sheets)}}
  else{try{XLSX.writeFile(wb,filename);toast('Excel descargado: '+filename)}catch(e){csvFallback(filename,sheets)}}
}
function csvFallback(filename,sheets){

  openModal(mHead('Copiar datos para Excel','En esta vista no se puede descargar el archivo. Copiá los datos y pegalos en una planilla.')+`<div class="mb"><textarea id="csv-out" rows="12" readonly>${esc(parts.join('\n\n'))}</textarea></div><div class="mf"><button class="btn primary" data-act="copycsv">${ic('copy')}Copiar</button></div>`,true)}
const rowsProductos=()=>S.productos.map(p=>({'Código':p.codigo,'Producto':p.nombre,'Categoría':p.categoria,'Proveedor':(prov(p.provId)||{}).nombre||'','Unidad':p.unidad,'Precio de compra (sin IVA)':p.costo,'Ganancia %':p.margen,'IVA %':p.iva,'Precio de venta':p.precio,'Stock':p.stock,'Avisar con menos de':p.stockMin}));
const rowsVentas=()=>[...S.ventas].sort((a,b)=>a.fecha<b.fecha?-1:1).map(v=>({'Fecha':fDT(v.fecha),'Comprobante':TIPOS[v.tipo].nombre,'Número':v.nro,'Cliente':(cli(v.clienteId)||{}).nombre,'Cómo pagó':ML(v.medio),'Desc. %':v.desc,'Neto':v.neto,'IVA':r2(v.i21+v.i105),'Total':v.total,'Costo mercadería':v.costo,'Ganancia bruta':r2(v.neto-v.costo),'CAE':v.cae}));
const rowsDetalle=()=>S.ventas.flatMap(v=>v.items.map(i=>({'Fecha':fDT(v.fecha),'Comprobante':v.nro,'Producto':i.nombre,'Cantidad':i.cant,'Precio':i.precio,'Subtotal':r2(i.precio*i.cant*(1-(v.desc||0)/100))})));
const rowsCompras=()=>S.compras.map(c=>({'Fecha':fD(c.fecha),'Proveedor':(prov(c.provId)||{}).nombre,'Comprobante':c.tipo,'Número':c.nroComp,'Neto':c.neto,'IVA':c.iva,'Total':c.total,'Pago':c.cond==='cc'?'Quedó debiendo':'Pagado en '+c.medio}));
const rowsProv=()=>S.proveedores.map(p=>({'Proveedor':p.nombre,'CUIT':p.cuit,'Rubro':p.rubro,'Contacto':p.contacto,'Teléfono':p.tel,'Días para pagar':p.plazo,'Le debés':saldoProv(p.id)}));
const rowsCli=()=>S.clientes.map(c=>({'Cliente':c.nombre,'Condición IVA':COND[c.condIva],'CUIT/Doc':c.cuit,'Teléfono':c.tel,'Te debe':saldoCli(c.id)}));

    case 'hphoy':hp.ref=today();render();break;
    case 'hpdrill':hp.tipo=b.dataset.t;hp.ref=b.dataset.r;render();window.scrollTo(0,0);break;
    case 'exphist':{const R=rango(hp.tipo,hp.ref||today());const st=statsR(R);
      const resumen=R.sub.filter(x=>x.f<=new Date()).map(x=>{const vs=st.vs.filter(v=>enR(v.fecha,x));return {'Período':x.nombre||x.l,'Ventas':vs.length,'Vendiste':r2(sum(vs,'total')),'Ganancia bruta':r2(sum(vs,v=>v.neto-v.costo))}});
      exportXLSX(`historial-${slug(R.label)}.xlsx`,{'Resumen':resumen,'Ventas':st.vs.map(v=>({'Fecha':fDT(v.fecha),'Comprobante':TIPOS[v.tipo].nombre,'Número':v.nro,'Cliente':(cli(v.clienteId)||{}).nombre,'Cómo pagó':ML(v.medio),'Total':v.total,'Ganancia bruta':r2(v.neto-v.costo)})),'Gastos':st.gs.map(g=>({'Fecha':fD(g.fecha),'Tipo':g.categoria,'Detalle':g.detalle,'Monto':g.monto}))});break}
    case 'expiva':exportXLSX(`para-el-contador-${rMes}.xlsx`,{'IVA Ventas':rowsIvaVentas(rMes),'IVA Compras':rowsIvaCompras(rMes)});break;
    case 'expall':rMes=rMes||today().slice(0,7);exportXLSX(`${slug(S.config.nombre)}-${today()}.xlsx`,{'Productos':rowsProductos(),'Ventas':rowsVentas(),'Detalle de ventas':rowsDetalle(),'Mercadería recibida':rowsCompras(),'Proveedores':rowsProv(),'Clientes':rowsCli(),'Gastos':rowsGastos(),['IVA Ventas '+rMes]:rowsIvaVentas(rMes),['IVA Compras '+rMes]:rowsIvaCompras(rMes)});break;
    /* config */
    case 'reset':confirmReset=b.dataset.k;render();break;
    case 'noreset':confirmReset=null;render();break;
    case 'doreset':doReset();break;
    case 'copycsv':copyText($('#csv-out').value,$('#csv-out'));break;
  }
});

document.addEventListener('submit',e=>{
  const fm=e.target;const k=fm.dataset.form;if(!k)return;e.preventDefault();
  if(k==='scan'){const inp=$('#pos-q');const q=inp.value.trim();if(!q)return;const ex=S.productos.find(p=>p.codigo===q);const hit=ex||posFiltered()[0];
    if(hit){posAdd(hit.id);pos.q='';inp.value='';renderPosGrid()}else toast('No encontramos "'+q+'"');inp.focus();return}
  if(k==='prod')return saveProd(fm);
  if(k==='ajuste')return saveAjuste(fm);
  if(k==='aumento')return saveAumento(fm);
  const d=Object.fromEntries(new FormData(fm));
  if(k==='prov'){const id=fm.dataset.id;const base={nombre:d.nombre.trim(),cuit:d.cuit.trim(),rubro:d.rubro.trim(),contacto:d.contacto.trim(),tel:d.tel.trim(),plazo:num(d.plazo)};
    if(id)Object.assign(prov(id),base);else S.proveedores.push({id:'p'+uid(),...base});save();closeModal();render();toast('Proveedor guardado')}
  if(k==='cli'){const id=fm.dataset.id;const base={nombre:d.nombre.trim(),condIva:d.condIva,cuit:d.cuit.trim(),tel:d.tel.trim()};
    if(id)Object.assign(cli(id),base);else S.clientes.push({id:'c'+uid(),...base});save();closeModal();render();toast('Cliente guardado')}
  if(k==='pago'){const m=num(d.monto);if(m<=0)return;const rec={id:uid(),fecha:new Date().toISOString(),monto:r2(m),medio:d.medio,detalle:''};
    if(fm.dataset.kind==='prov'){rec.provId=fm.dataset.id;S.pagos.push(rec)}else{rec.cliId=fm.dataset.id;S.cobros.push(rec)}save();closeModal();render();toast(fm.dataset.kind==='prov'?'Pago anotado':'Cobro anotado')}
  if(k==='gasto'){S.gastos.push({id:uid(),fecha:new Date().toISOString(),categoria:gDraft.categoria,detalle:d.detalle.trim(),monto:r2(num(d.monto)),medio:gDraft.medio});save();closeModal();render();toast('Gasto anotado')}
  if(k==='cierre'){const day=fm.dataset.day;const inp=fm.querySelector('[data-cierre]');const esp=num(inp.dataset.cierre),cont=num(d.contado);const dif=r2(cont-esp);
    S.cierres=S.cierres.filter(c=>c.fecha!==day);S.cierres.push({fecha:day,esperado:r2(esp),contado:r2(cont),dif});if(day===today())S.guia.cierre=true;save();closeModal();render();
    toast(Math.abs(dif)<1?'Caja cerrada. ¡Cerró justa!':dif>0?'Caja cerrada con sobrante de '+f$(dif):'Caja cerrada con faltante de '+f$(-dif))}
  if(k==='config'){Object.assign(S.config,{nombre:d.nombre.trim(),razon:d.razon.trim(),cuit:d.cuit.trim(),iibb:d.iibb.trim(),domicilio:d.domicilio.trim(),inicio:d.inicio,condIva:d.condIva,pv:Math.max(1,Math.round(num(d.pv))),fondo:num(d.fondo),letra:d.letra});
    pos.tipo=null;save();render();toast('Cambios guardados')}
});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='pos-q'){pos.q=t.value;renderPosGrid();return}
  if(t.dataset.pf){pf[t.dataset.pf]=t.value;renderProdTable();return}
  if(t.dataset.calc){onProdCalc(t);return}
  if(t.dataset.llc){ll.cant[t.dataset.llc]=t.value;llTotals();return}
  if(t.dataset.llk){ll.costo[t.dataset.llk]=t.value;llTotals();return}
  if(t.dataset.llf==='nro'){ll.nro=t.value;return}
  if(t.dataset.cierre){const dif=num(t.value)-num(t.dataset.cierre);$('#ci-dif').innerHTML=t.value===''?'':Math.abs(dif)<1?`<div class="okbox">${ic('check')}Cierra justa</div>`:`<div class="note"><strong style="color:var(--bad)">${dif>0?'Sobran '+f$(dif):'Faltan '+f$(-dif)}</strong>. Volvé a contar antes de cerrar.</div>`;return}
  if(t.dataset.imp==='txt'){if(t.value.trim())readImport(t.value,true);return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.pos){const k=t.dataset.pos;if(k==='desc')pos.desc=Math.min(100,Math.max(0,num(t.value)));else if(k==='paga')pos.paga=num(t.value);else pos[k]=t.value;if(k==='clienteId')pos.tipo=null;renderCart();return}
  if(t.dataset.poscant!=null){const ix=+t.dataset.poscant;const it=pos.items[ix];const p=prod(it.pid);let c=num(t.value);if(p&&c>p.stock){c=p.stock;toast('Solo quedan '+fn(p.stock))}if(c<=0)pos.items.splice(ix,1);else it.cant=c;renderCart();return}
  if(t.dataset.lladd){if(t.value){ll.extra.push(t.value);ll.cant[t.value]=ll.cant[t.value]||1;render()}return}
  if(t.dataset.llf==='tipo'){ll.tipo=t.value;llTotals();return}
  if(t.dataset.llf==='act'){ll.act=t.checked;return}
  if(t.dataset.caja==='dia'){cajaDia=t.value||today();render();return}
  if(t.dataset.caja==='mes'){gastoMes=t.value;render();return}
  if(t.dataset.rep==='mes'){rMes=t.value;render();return}
  if(t.dataset.imp==='file'){const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>readImport(new Uint8Array(r.result),false);r.readAsArrayBuffer(f);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(menuOpen){menuOpen=false;render()}}});

const VIEWS={inicio:vInicio,vender:vVender,mercaderia:vMercaderia,caja:vCaja,proveedores:vProveedores,clientes:vClientes,informes:vInformes,config:vConfig};

/* ================== arranque ================== */
load();
{const h=(location.hash||'').slice(1);if(VIEWS[h])view=h}
render();
(async()=>{try{if(window.claude&&window.claude.use){downloads=await window.claude.use('downloads')}}catch(e){downloads=null}})();
</script>
